<!DOCTYPE html>
<html lang="es">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <meta content="Prototipo académico de gestión de peticiones de cambios de software de la Universidad Técnica de Ambato." name="description"/>
  <title>
   BusesUTA · Control de cambios
  </title>
  <link href="css/styles.css" rel="stylesheet"/>
  <script defer="" src="js/app.js">
  </script>
 </head>
 <body>
  <a class="skip" href="#content">
   Saltar al contenido
  </a>
  <div class="main-shell">
   <header class="topbar">
    <a class="bus-brand" href="#panel" aria-label="BusesUTA, inicio"><span class="bus-logo"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="4" width="18" height="23" rx="4"/><path d="M7 16h18M11 8h10M10 27v3m12-3v3M4 11v7m24-7v7"/><circle cx="12" cy="22" r="1"/><circle cx="21" cy="22" r="1"/></svg></span><span>Buses<b>UTA</b></span></a>
    <strong class="system-title">Sistema de Control de Cambios - BusesUTA</strong>
    <div class="topbar-right" id="session-controls">Cargando sesión…</div>
   </header>
   <nav class="app-nav" aria-label="Navegación principal"><a data-nav="panel" href="#panel">Panel principal</a><a data-nav="solicitudes" href="#solicitudes">Solicitudes <span id="nav-count">0</span></a><a data-nav="nueva" href="#nueva">Nueva solicitud</a><a data-nav="consulta" href="#consulta">Consultar estado</a><span id="breadcrumb" class="visually-hidden">Panel principal</span></nav>
   <main id="content" tabindex="-1">
   </main>
   <footer>
    BusesUTA · Sistema de Control de Cambios
    <span>
     Proyecto académico · UTA
    </span>
   </footer>
  </div>
  <div aria-live="polite" class="toast" hidden="" id="toast" role="status">
  </div>
  <dialog id="delete-dialog">
   <form method="dialog">
    <div class="dialog-icon" data-icon="trash">
    </div>
    <h2>
     ¿Eliminar esta solicitud?
    </h2>
    <p id="delete-description">
    </p>
    <p>
     Esta acción no se puede deshacer.
    </p>
    <div class="actions">
     <button class="btn" value="cancel">
      Cancelar
     </button>
     <button class="btn danger" value="delete">
      Sí, eliminar
     </button>
    </div>
   </form>
  </dialog>
  <noscript>
   Activa JavaScript para utilizar este prototipo.
  </noscript>
 </body>
</html>
